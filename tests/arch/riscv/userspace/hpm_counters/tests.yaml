common:
  tags:
    - kernel
    - riscv
    - userspace
  ignore_faults: true
  platform_allow:
    - qemu_riscv32
    - qemu_riscv64
  integration_platforms:
    - qemu_riscv32
    - qemu_riscv64
  filter: CONFIG_RISCV_ISA_EXT_ZIHPM
tests:
  arch.riscv.userspace.hpm_counters.default: {}
  arch.riscv.userspace.hpm_counters.enabled:
    extra_configs:
      - CONFIG_RISCV_USER_HPM_COUNTER_ACCESS=y
