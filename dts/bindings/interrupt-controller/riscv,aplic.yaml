description: |
  RISC-V Advanced Platform-Level Interrupt Controller (APLIC).

  The APLIC routes wired interrupts in a RISC-V AIA system.  It can operate
  in two delivery modes:

    - MSI mode: interrupts are converted to Message-Signaled Interrupts and
      forwarded to an IMSIC.  Indicated by the presence of 'msi-parent'.
    - Direct delivery mode: interrupts are delivered directly to harts via
      the external interrupt signal.

compatible: "riscv,aplic"

include: [interrupt-controller.yaml, base.yaml]

properties:
  reg:
    required: true
    description: Base address and size of the APLIC registers

  riscv,num-sources:
    type: int
    required: true
    description: Number of interrupt sources supported by the APLIC

  riscv,max-priority:
    type: int
    description: |
      Maximum priority level supported by the APLIC implementation.
      Present on some platforms (e.g., QEMU virt) as well as if direct
      delivery mode is enabled.

  msi-parent:
    type: phandle
    description: |
      Phandle to the IMSIC controller used for MSI delivery.
      When present the driver operates in MSI mode; when absent
      direct delivery mode is assumed.

  riscv,children:
    type: phandles
    description: |
      Child APLIC domains of this domain. The position of a child in this
      list is its child index in the sourcecfg registers of this domain.

  riscv,delegation:
    type: phandle-array
    specifier-space: aplic-delegation
    description: |
      Interrupt sources delegated to child domains at initialization. Each
      entry is a child domain phandle followed by the first and last source
      number of the delegated range in this domain. Every child domain
      referenced here must be listed in riscv,children and have
      #aplic-delegation-cells = <2>.

  "#aplic-delegation-cells":
    type: int
    const: 2
    description: |
      Number of cells in a riscv,delegation specifier. Required in child
      domains that a parent delegates sources to.

interrupt-cells:
  - irq
  - priority
  - flags

aplic-delegation-cells:
  - first-source
  - last-source
